name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project shell
        run: flutter create --org com.example --project-name daily_task_reminder --platforms android build_app

      - name: Overlay app sources
        run: |
          rm -rf build_app/lib
          cp -r app/lib build_app/lib
          cp app/pubspec.yaml build_app/pubspec.yaml
          cp app/android/app/src/main/AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml

      - name: Enable core library desugaring
        working-directory: build_app/android/app
        run: |
          sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> build.gradle.kts
          grep -n "Desugaring" build.gradle.kts

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: daily-tasks-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
